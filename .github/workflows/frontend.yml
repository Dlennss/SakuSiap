name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "pulsa-fe/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "pulsa-fe/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build Next.js frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: pulsa-fe

    env:
      API_BASE: http://127.0.0.1:8105
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8105
      NEXTAUTH_URL: http://localhost:3105
      NEXT_PUBLIC_SITE_URL: http://localhost:3105
      NEXTAUTH_SECRET: ci-nextauth-secret
      AUTH_SECRET: ci-auth-secret
      ADMIN_TOKEN: ci-admin-token
      NEXT_PUBLIC_TURNSTILE_ENABLED: "false"
      NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED: "false"
      GOOGLE_LOGIN_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulsa-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
